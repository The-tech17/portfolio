<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanjana Londhe | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background-color: #090b10;
            font-family: Arial, Helvetica, sans-serif;
            color: #f5f5f5;
        }

        .page {
            width: min(84vw, 1150px);
            min-height: 575px;
            margin: 112px auto 30px;
            border: 1px solid #252a33;
            border-radius: 26px;
            overflow: hidden;
            background-color: #090b10;
        }

        /* Navigation */
        nav {
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #252a33;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 34px;
        }

        nav ul li a {
            color: #e7e7e7;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        nav ul li a:hover {
            color: #ffffff;
        }

        /* Hero Section */
        .hero {
            padding: 42px 24px;
        }

        .hero h1 {
            font-size: clamp(40px, 4vw, 54px);
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 24px;
        }

        .hero p {
            font-size: 18px;
            color: #aeb5c1;
            letter-spacing: 0.3px;
            line-height: 1.6;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            .page {
                width: 92vw;
                margin-top: 30px;
                min-height: 600px;
                border-radius: 18px;
            }

            nav {
                padding: 0 18px;
                overflow-x: auto;
            }

            nav ul {
                gap: 22px;
            }

            nav ul li a {
                font-size: 14px;
            }

            .hero {
                padding: 38px 22px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <!-- Hero Section -->
        <section class="hero" id="about">
            <h1>Hi, I'm Sanjana 👋</h1>

            <p>
                Prompt Engineer • AI Developer • Android Developer • Creative Writer
            </p>
        </section>

    </main>

</body>
</html>
